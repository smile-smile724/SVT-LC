[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtweb-semantic-service"
version = "0.1.0"
description = "Semantic prototype service scaffold for Semantic-MT-Web3D"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
